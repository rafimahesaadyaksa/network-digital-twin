name: ndt

topology:
  groups:
    routers:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      exec:
        - sysctl -w net.ipv4.ip_forward=1

    hosts:
      kind: linux
      image: wbitt/network-multitool:3.22.2

  nodes:
    r1:
      group: routers
      binds:
        - r1/daemons:/etc/frr/daemons
        - r1/frr.conf:/etc/frr/frr.conf

    r2:
      group: routers
      binds:
        - r2/daemons:/etc/frr/daemons
        - r2/frr.conf:/etc/frr/frr.conf

    r3:
      group: routers
      binds:
        - r3/daemons:/etc/frr/daemons
        - r3/frr.conf:/etc/frr/frr.conf

    client:
      group: hosts
      exec:
        - ip link set eth1 up
        - ip address add 192.168.10.10/24 dev eth1
        - ip route add 192.168.30.0/24 via 192.168.10.1 dev eth1

    server:
      group: hosts
      exec:
        - ip link set eth1 up
        - ip address add 192.168.30.10/24 dev eth1
        - ip route add 192.168.10.0/24 via 192.168.30.1 dev eth1

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r1:eth2", "r3:eth2"]
    - endpoints: ["client:eth1", "r1:eth3"]
    - endpoints: ["server:eth1", "r3:eth3"]
